# UI parameter config — labels, tooltips, and input ranges for the form.
# Keyed by the flat `Parameters` field names (e.g. `vaccine_ve_s`).
#
# Each parameter table's `default` value is the runtime source of frontend defaults.
#
# Every visible entry MUST declare `section = "<id>"` — this drives both the
# sidebar grouping and the PDF report's Parameters section. Valid ids:
# "scenario", "vaccine", "antivirals", "community". Adding a field
# here automatically adds it to the PDF export; no other edits required.
# For fields only shown when the vaccine is 2-dose, set `show_when_doses_2 = true`.

# Structural and non-editable parameters still live in their own parameter
# tables so every runtime default has one unambiguous home.
[n]
default = 2

[population_fraction_labels]
default = ["Children", "Adults"]

[population_fractions]
default = [0.25, 0.75]

[contact_matrix]
default = [18.0, 9.0, 3.0, 12.0]

[inf_hosp_delay]
default = 7.0

[inf_death_delay]
default = 10.0

# ---- SCENARIO ---------------------------------------------------------------

[days]
section = "scenario"
label = "Simulation duration (days)"
tooltip = "Number of days simulated"
min = 1
max = 500
step = 1
default = 365
type = "integer"
slider = true

[population]
section = "scenario"
label = "Population size"
tooltip = "The total number of people in the simulation"
min = 1
step = 1_000_000
default = 330_000_000
type = "integer"

[initial_infections]
section = "scenario"
label = "Initial infections"
tooltip = "Number of people infected at the start of the simulation"
min = 0
step = 100
default = 1000
type = "float"

[fraction_initial_immune]
section = "scenario"
label = "Prior immunity"
tooltip = "Proportion of the population that is immune (i.e., cannot be infected during the outbreak) at the start of the simulation"
min = 0
max = 1
step = 0.01
default = 0.1
type = "percent"
slider = true

[r0]
section = "scenario"
label = "Basic reproduction number"
tooltip = "Average number of people infected by one infectious person in a population with no prior immunity and no public health interventions"
min = 1.0
max = 2.0
step = 0.1
default = 1.4
type = "float"
slider = true

[latent_period]
section = "scenario"
label = "Latent period"
tooltip = "Average time from infection to becoming infectious (days)"
min = 0.5
max = 2.5
step = 0.1
default = 1.5
type = "float"
slider = true

[infectious_period]
section = "scenario"
label = "Infectious period"
tooltip = "Average time an infected person can transmit influenza (days)"
min = 1
max = 4.5
step = 0.1
default = 2.0
type = "float"
slider = true

[p_symp_given_inf]
section = "scenario"
label = "Symptomatic fraction"
tooltip = "Proportion of infections that develop symptoms in the absence of interventions. Symptomatic and asymptomatic infections are assumed to be equally infectious unless an intervention depends on symptoms."
min = 0.3
max = 0.8
step = 0.01
default = [0.55, 0.55]
type = "percent"
slider = true
per_group = true

[p_hosp_given_symp]
section = "scenario"
label = "Symptomatic-hospitalization ratio"
tooltip = "Proportion of symptomatic infections that result in hospitalization in the absence of interventions"
min = 0.0
max = 0.3
step = 0.001
default = [0.02, 0.2]
type = "percent"
slider = true
per_group = true

[p_death_given_hosp]
section = "scenario"
label = "Hospitalization-fatality ratio"
tooltip = "Proportion of hospitalized infections that would result in death without interventions; all deaths are assumed to occur among hospitalized individuals"
min = 0.0
max = 0.15
step = 0.001
default = [0.075, 0.075]
type = "percent"
slider = true
per_group = true

# ---- VACCINE ---------------------------------------------------------------

[vaccine_enabled]
default = true

[vaccine_doses]
section = "vaccine"
label = "Number of doses"
default = 1
type = "select"
options = [
    { value = 1, label = "One dose" },
    { value = 2, label = "Two doses" },
]

[vaccine_start]
section = "vaccine"
label = "Start of vaccination campaign"
tooltip = "Simulation day on which vaccine administration begins"
min = 0
max = 200                                                         # clamped to days at runtime
step = 1
default = 100
type = "integer"
slider = true

[vaccine_doses_available]
section = "vaccine"
label = "Total doses available"
tooltip = "Total number of vaccine doses available during the simulation. Together with the administration rate, this limits how many doses can be given"
min = 0
step = 1_000_000
default = 165_000_000
type = "integer"
slider = true

[vaccine_administration_rate]
section = "vaccine"
label = "Administration rate"
tooltip = "Maximum number of vaccine doses that can be administered per day"
min = 0
max = 30_000_000
step = 1_000_000
default = 3_000_000
type = "integer"
slider = true

[vaccine_dose2_delay]
section = "vaccine"
show_when_doses_2 = true
label = "Delay between doses"
tooltip = "Time that a person must wait before receiving their second dose, in days"
min = 14
max = 200                                                                            # clamped to days at runtime
step = 1
default = 30
type = "integer"
slider = true

[vaccine_p_get_2_doses]
section = "vaccine"
show_when_doses_2 = true
label = "Fraction of vaccinees who receive 2 doses"
tooltip = "Of people who receive a first dose, the proportion that also receive a second dose"
min = 0
max = 1
step = 0.01
default = 0.9
type = "percent"
slider = true

[vaccine_ve_s]
section = "vaccine"
label = "Vaccine effectiveness against infection"
tooltip = "Proportional reduction in the probability of becoming infected after vaccine protection develops"
range_with = "vaccine_ve_2s"
range_label = "Vaccine effectiveness against infection (1st and 2nd dose)"
range_tooltip = "Proportional reduction in the probability of becoming infected after vaccine protection develops. The left handle is the effect after the first dose, the right handle after the second."
min = 0
max = 1
step = 0.01
default = 0.20
type = "percent"
slider = true

[vaccine_ve_i]
section = "vaccine"
label = "Vaccine effectiveness against onward transmission"
tooltip = "Proportional reduction in infectiousness among people who become infected after vaccine protection develops"
range_with = "vaccine_ve_2i"
range_label = "Vaccine effectiveness against onward transmission (1st and 2nd dose)"
range_tooltip = "Proportional reduction in infectiousness among people who become infected after vaccine protection develops. The left handle is the effect after the first dose, the right handle after the second."
min = 0
max = 1
step = 0.01
default = 0.0
type = "percent"
slider = true

[vaccine_ve_p]
section = "vaccine"
label = "Vaccine effectiveness against symptomatic disease"
tooltip = "Proportional reduction in the probability of developing symptoms among people who become infected after vaccine protection develops"
range_with = "vaccine_ve_2p"
range_label = "Vaccine effectiveness against symptomatic disease (1st and 2nd dose)"
range_tooltip = "Proportional reduction in the probability of developing symptoms among people who become infected after vaccine protection develops. The left handle is the effect after the first dose, the right handle after the second."
min = 0
max = 1
step = 0.01
default = 0.65
type = "percent"
slider = true

[vaccine_ve_2s]
section = "vaccine"
show_when_doses_2 = true
label = "Effectiveness for susceptibility (2nd dose)"
tooltip = "Proportion of potential infections among the vaccine-protected that are averted, after the second dose"
min = 0
max = 1
step = 0.01
default = 0.60
type = "percent"
slider = true

[vaccine_ve_2i]
section = "vaccine"
show_when_doses_2 = true
label = "Effectiveness for onward transmission (2nd dose)"
tooltip = "Proportion of onward transmissions among the vaccine-protected that are averted, after the second dose"
min = 0
max = 1
step = 0.01
default = 0.0
type = "percent"
slider = true

[vaccine_ve_2p]
section = "vaccine"
show_when_doses_2 = true
label = "Effectiveness for symptomatic disease (2nd dose)"
tooltip = "Proportion of symptomatic disease among the vaccine-protected that is averted, after the second dose"
min = 0
max = 1
step = 0.01
default = 0.75
type = "percent"
slider = true

[vaccine_ramp_up]
section = "vaccine"
label = "Delay from dose to protection (days)"
tooltip = "Time from vaccination to achieving protection from vaccination. Individuals infected before the delay is complete have no protection from vaccination."
min = 0
max = 30
step = 1
default = 14
type = "integer"
slider = true

# ---- ANTIVIRALS ------------------------------------------------------------

[antivirals_ave_i]
section = "antivirals"
label = "Antiviral effectiveness against onward transmission"
tooltip = "Proportional reduction in infectiousness among symptomatic people who receive outpatient antivirals"
min = 0
max = 0.5
step = 0.01
default = 0.20
type = "percent"
slider = true

[antivirals_enabled]
default = false

[antivirals_ave_p_hosp]
section = "antivirals"
label = "Antiviral effectiveness against hospitalization"
tooltip = "Proportional reduction in hospitalization risk among symptomatic people who receive outpatient antivirals"
min = 0
max = 0.5
step = 0.01
default = 0.20
type = "percent"
slider = true

[antivirals_ave_p_death]
section = "antivirals"
label = "Antiviral effectiveness against death"
tooltip = "Proportional reduction in death risk among hospitalized people who receive inpatient antivirals. The model assumes that all deaths occur among hospitalized patients."
min = 0
max = 1
step = 0.01
default = 0.20
type = "percent"
slider = true

[antivirals_fraction_outpatient]
section = "antivirals"
label = "Fraction of symptomatic infections that receive outpatient antivirals"
tooltip = "Fraction that seek care, are prescribed outpatient antivirals, and adhere to the regimen"
min = 0
max = 1
step = 0.01
default = 0.10
type = "percent"
slider = true

[antivirals_fraction_inpatient]
section = "antivirals"
label = "Fraction of hospitalized cases that receive inpatient antivirals"
tooltip = "Proportion of hospitalized infections that are prescribed inpatient antivirals"
min = 0
max = 1
step = 0.01
default = 1.0
type = "percent"
slider = true

# ---- COMMUNITY -------------------------------------------------------------

[community_start]
section = "community"
label = "Start day"
tooltip = "First day that the intervention has its effect"
min = 0
max = 200                                                  # clamped to days at runtime
step = 1
default = 60
type = "integer"
slider = true

[community_duration]
section = "community"
label = "Duration (days)"
tooltip = "Time over which the intervention has its effect"
min = 1
max = 140                                                   # clamped to days-start at runtime
step = 1
default = 20
type = "integer"
slider = true

[community_effectiveness]
section = "community"
label = "Effectiveness"
tooltip = "Proportional reduction in transmission due to the intervention, where negative values mean an increase in transmission. Effects are symmetric (e.g., child-to-adult and adult-to-child are changed equally)."
min = -1
max = 1
step = 0.1
default = [0.5, -0.10, -0.10, 0.0]
type = "percent"
matrix = true

[community_enabled]
default = false
