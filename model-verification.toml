# Model verification inventory. See README.md#model-verification

[[item]]
category = "logic edge"
claim = "Initial susceptible, infected, and immune counts for a representative population group are allocated from the requested initial conditions"
oracle = "Hand-calculated counts agree within absolute 1e-5"
test_name = "model::test::test_distribute_initials"

[[item]]
category = "logic edge"
claim = "Initial immunity takes precedence over initial infection when their requested counts exceed a group population"
oracle = "Hand-calculated boundary allocation agrees within absolute 1e-5"
test_name = "model::test::test_distribute_initials_precedence"

[[item]]
category = "logic symmetry"
claim = "Prior immunity is equivalent to reducing both the susceptible population and effective R0 by the nonimmune fraction"
oracle = "Population-adjusted attack rates agree within absolute 1e-10"
test_name = "model::test::test_seir_immune_equivalent"

[[item]]
category = "snapshot"
claim = "The homogeneous unmitigated 300-day attack rate remains at its stored baseline"
