# Task runner config — https://plzplz.org
# run `plz hooks install` once per clone.

# Start the dev server
[tasks.dev]
run = "vite"
env = "pnpm"

# Production build of the app
[tasks.build]
run = "vite build"
env = "pnpm"

[taskgroup.docs]
extends = { env = "pnpm" }

# Develop the docs site
[taskgroup.docs.dev]
description = "Start the VitePress dev server"
run = "vitepress dev docs"

# Build the docs site
[taskgroup.docs.build]
run = "vitepress build docs"

[tasks.format]
description = "Format Rust and Markdown"
run_parallel = ["plz:format-rust", "plz:format-md"]

# Format the Rust sources
[tasks.format-rust]
dir = "model"
run = "cargo fmt"

[tasks.format-check]
description = "Check Rust and Markdown formatting, without rewriting"
run_parallel = ["plz:format-check-rust", "plz:format-check-md"]

[tasks.format-check-rust]
dir = "model"
run = "cargo fmt --check"
fail_hook = { suggest_command = "plz format" }

[tasks.format-check-md]
description = "Check formatting of Markdown files"
run = "panache format --check ."

[tasks.format-md]
description = "Format Markdown files"
run = "panache format ."

# Lint, treating every warning as an error
[tasks.clippy]
dir = "model"
run = "cargo clippy --all-targets -- -D warnings"

[taskgroup.test]
[taskgroup.test.run]
description = "Run model test suite"
dir = "model"
run = "cargo test"

[taskgroup.test.update]
description = "Update test fixtures"
dir = "model"
run = "cargo run -p cfa-flu-simulator --bin update_snapshot"

# Checks run before each commit
[tasks.precommit]
run_serial = ["plz:format-check", "plz:clippy", "plz:test:run"]
git_hook = "pre-commit"
